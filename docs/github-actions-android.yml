name: Build APK

on:
  push:
    branches:
      - arena/01a07d1e-first-video-player
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Aether-debug.apk
          cp app/build/outputs/apk/release/*.apk dist/Aether-release.apk
          ls -lh dist

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aether-apks
          path: dist/*.apk
          if-no-files-found: error

      - name: Commit APKs to branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/01a07d1e-first-video-player'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/Aether-debug.apk dist/Aether-release.apk
          if git diff --cached --quiet; then
            echo "No APK changes"
          else
            git commit -m "Build: add debug and release APKs"
            git push
          fi
